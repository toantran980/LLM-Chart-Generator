services:
  server:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    environment:
      - PORT=4000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_INPUT_USD_PER_1M_TOKENS=${OPENAI_INPUT_USD_PER_1M_TOKENS:-}
      - OPENAI_OUTPUT_USD_PER_1M_TOKENS=${OPENAI_OUTPUT_USD_PER_1M_TOKENS:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:8b}
      - APP_API_KEY=${APP_API_KEY:-}
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL:-}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN:-}
      - AUTH_RATE_LIMIT_MAX=${AUTH_RATE_LIMIT_MAX:-20}
      - AUTH_RATE_LIMIT_WINDOW_MS=${AUTH_RATE_LIMIT_WINDOW_MS:-60000}
      - AUTH_DAILY_RATE_LIMIT_MAX=${AUTH_DAILY_RATE_LIMIT_MAX:-200}
      - GLOBAL_DAILY_RATE_LIMIT_MAX=${GLOBAL_DAILY_RATE_LIMIT_MAX:-1000}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - POSTGRES_URL=${POSTGRES_URL:-}
      - DATABASE_URL=${DATABASE_URL:-}
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: ./client/Dockerfile
    ports:
      - "80:8080"
    depends_on:
      - server
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
